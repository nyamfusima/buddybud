# Render Blueprint: one web service (API + built frontend) + Postgres.
# Free plan sleeps after 15 min idle; switch plan to "starter" ($7/mo) for the pilot.
services:
  - type: web
    name: buddybud
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: buddybud-db, property: connectionString }
databases:
  - name: buddybud-db
    plan: free
