# docker compose up --build        -> app on http://localhost:8000 (Postgres-backed)
# docker compose --profile ollama up   -> also runs a local Ollama model server
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: buddybud
      POSTGRES_PASSWORD: buddybud
      POSTGRES_DB: buddybud
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddybud"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://buddybud:buddybud@db:5432/buddybud
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:8000
      FRONTEND_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: [models:/app/models]

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  models:
  ollama:
